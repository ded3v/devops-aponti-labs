name: GitHub Secrets - demonstração

on:
  push:
    branches: [main]
    paths:
      - 'github-secrets-demo/**'
      - '.github/workflows/github-secrets-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: github-secrets-demo/app

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: github-secrets-demo/app/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Executar aplicação com o Secret
        env:
          MENSAGEM_SECRETA: ${{ secrets.MENSAGEM_SECRETA }}
        run: npm start

